# מילות החרגה (רעש; נוכחותן בלבד, בלי מילת ביצוע = לא לכלול)
# הערה: "תכנון" ו"פיקוח" לא נמצאים כאן בכוונה — מכרזי "תכנון וביצוע"
# (Design-Build) חייבים להיכלל. רק מכרזי תכנון/פיקוח/ייעוץ טהורים מוחרגים,
# וזה מושג ע"י מילות ההחרגה הספציפיות "תכנון בלבד" / "ניהול ופיקוח" וכו'.
