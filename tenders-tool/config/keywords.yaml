# ============================================================================
#  מילות מפתח לסיווג מכרזי תשתיות.
#  קובץ זה נטען בכל הרצה — אפשר לכוונן בלי לגעת בקוד.
#
#  לוגיקת ההכללה (ראה infra_tenders/core/filtering.py):
#    1. אם הכותרת/קטגוריה מכילה מילת החרגה (exclude) ואין בה אף מילת ביצוע
#       (execution) — לא לכלול.
#    2. אחרת, אם מכיל מילת תשתית (infra) — לכלול.
#    3. ביטחון (match_confidence):
#         high  = מכיל גם מילת תשתית וגם מילת ביצוע.
#         low   = מכיל מילת תשתית בלבד / יש ספק / לא ניתן לפענח מועד הגשה.
#  כשיש ספק — כולל ומסמן low כדי שתעבור עליהם ידנית ב-_index.csv.
# ============================================================================

