# ============================================================================
#  רשימת המקורות (מפרסמי מכרזים).
#  כל מקור = מתאם (adapter) ב-infra_tenders/adapters/<name>.py.
#  הוספת מקור חדש = הוספת מתאם + רשומה כאן. הליבה לא משתנה.
#
#  הכתובות אומתו ב-WebSearch (יוני 2026) — ראה docs/SOURCES.md לפירוט מלא
#  (טכנולוגיית האתר, האם דורש התחברות, סבירות לחוברת בתשלום).
#  עדיין יש לאמת בזמן ריצה — אתרים משתנים.
#
#  שדות:
#    name            מזהה קצר (משמש ב---source <name>). תואם לשם המתאם.
#    publisher       שם המפרסם בעברית (משמש בשמות תיקיות וב-report).
#    enabled         האם לכלול ב---all.
#    requires_login  האם דורש אישורי גישה מ-.env.
#    urls            כתובות עמוד המכרזים.
#    notes           הערות (טכנולוגיה / תשלום / מצב מימוש).
# ============================================================================

sources:
  # === ממומש ====================================================================
  - name: iroads
    publisher: "נתיבי ישראל"
    enabled: true
    requires_login: false
    urls:
      - "https://www.iroads.co.il/מכרזים/מכרזים/"
      - "https://tender.iroads.co.il/"
    notes: "ממומש. אתר עשיר; מערכת מכרזים ייעודית ב-tender.iroads.co.il."

  # === מאומת, טרם מומש (מתאם בקרוב) =============================================
  - name: nta
    publisher: "נת\"ע"
    enabled: false
    requires_login: false
    urls:
      - "https://www.nta.co.il/tenders/"
    notes: "מאומת. רכבת קלה גוש דן — תשתיות מובהקות."

  - name: transisrael
    publisher: "חוצה ישראל"
    enabled: false
    requires_login: false
    urls:
      - "https://www.transisrael.co.il/Tenders"
