      מאומת. הורדת מסמכים חינם לאחר הרשמה. מלא MRGOV_USERNAME/PASSWORD ב-.env.
      ייתכן שדפדוף בסיסי אפשרי גם ללא התחברות — לבדוק בזמן מימוש.

  # === אגרגטור (לאיחוד מקורות) ==================================================
